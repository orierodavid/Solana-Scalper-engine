name: Scheduled wallet monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-wallet-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run read-only wallet check
        env:
          WALLET_PUBLIC_ADDRESS: ${{ secrets.WALLET_PUBLIC_ADDRESS }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          TRADING_MODE: paper
          LIVE_TRADING_ENABLED: "false"
        run: |
          if [ -z "$WALLET_PUBLIC_ADDRESS" ]; then
            echo "Missing GitHub Actions secret: WALLET_PUBLIC_ADDRESS"
            exit 1
          fi
          npm run monitor:once
